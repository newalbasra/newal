<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إشعارات الصيانة - ورشة البصرة</title>
    <!-- Bootstrap RTL CSS & JS Bundle -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SheetJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-card { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-whatsapp { background-color: #25D366; color: white; font-weight: bold; border-radius: 6px; }
        .btn-whatsapp:hover { background-color: #1ebd56; color: white; }
        .sent-row { background-color: #e8f5e9 !important; }
        .badge-devices { background-color: #0d6efd; font-size: 0.8rem; }
        .msg-preview-box { background-color: #f8f9fa; border-right: 4px solid #25D366; padding: 15px; border-radius: 8px; font-size: 0.95rem; white-space: pre-line; line-height: 1.6; }
    </style>
</head>
<body class="py-4">
<div class="container">
    <!-- Upload Section -->
    <div class="card main-card p-4 mb-4 text-center bg-white">
        <h3 class="mb-2 text-primary fw-bold">🛠️ نظام إشعار العملاء - ورشة البصرة</h3>
        <p class="text-muted mb-3">قم برفع تقرير الصيانة (.xlsx أو .csv) لتوليد إشعارات الاستلام</p>
        <div class="w-50 mx-auto">
            <input type="file" id="excelFile" class="form-control" accept=".xlsx, .xls, .csv">
        </div>
    </div>

    <!-- Results Table Section -->
    <div class="card main-card p-4 d-none bg-white" id="resultCard">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0 text-secondary">العملاء الجاهزة أجهزتهم (<span id="totalCustomers">0</span>)</h5>
            <input type="text" id="searchInput" class="form-control w-25" placeholder="🔍 بحث باسم العميل أو الهاتف..." onkeyup="filterTable()">
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-bordered text-center align-middle" id="customersTable">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 5%;">#</th>
                        <th style="width: 25%;">اسم العميل</th>
                        <th style="width: 15%;">رقم الهاتف</th>
                        <th style="width: 10%;">عدد الأجهزة</th>
                        <th style="width: 25%;">تفاصيل الأجهزة المكتملة</th>
                        <th style="width: 10%;">الحالة</th>
                        <th style="width: 10%;">الإجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal لمعاينة الرسالة بشكل أنيق عند الطلب -->
<div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">معاينة نص الرسالة</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="modalMessageContent" class="msg-preview-box"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">إغلاق</button>
        <a id="modalSendBtn" href="#" target="_blank" class="btn btn-whatsapp btn-sm px-3">إرسال عبر واتساب 📲</a>
      </div>
    </div>
  </div>
</div>

<script>
    let currentModalRowIndex = null;

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheetName = workbook.SheetNames.length > 1 ? workbook.SheetNames[1] : workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const jsonData = XLSX.utils.sheet_to_json(sheet);

            processAndRenderData(jsonData);
        };
        reader.readAsArrayBuffer(file);
    });

    function cleanPhone(phone) {
        if (!phone) return "";
        let str = String(phone).replace(/\D/g, ''); 
        if (str.startsWith('0')) str = str.substring(1);
        if (!str.startsWith('964')) str = '964' + str;
        return str;
    }

    function cleanName(name) {
        if (!name) return "عميلنا العزيز";
        return String(name).replace(/\(\d+\.\d+\.\d+\.\d+\)/g, '').trim();
    }

    function processAndRenderData(data) {
        const customersMap = {};

        data.forEach(row => {
            const rawPhone = row['تليفون محمول'] || row['عنوان العميل'];
            const rawName = row['اسم'];
            const status = row['حالة.1'] || row['حالة'] || '';

            if (!rawPhone || (status && !status.includes("12-"))) return;

            const phone = cleanPhone(rawPhone);
            const name = cleanName(rawName);
            
            let deviceDetails = row['نوع الجهاز'] || 'جهاز';
            if (row['نموذج']) {
                deviceDetails += ' (' + row['نموذج'] + ')';
            }

            if (!customersMap[phone]) {
                customersMap[phone] = { name: name, phone: phone, devices: [] };
            }
            if (deviceDetails.trim()) customersMap[phone].devices.push(deviceDetails.trim());
        });

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        let index = 1;
        const phoneKeys = Object.keys(customersMap);
        document.getElementById('totalCustomers').innerText = phoneKeys.length;

        phoneKeys.forEach(phone => {
            const customer = customersMap[phone];
            const devicesList = customer.devices.map(dev => `• ${dev}`).join('\n');

            const customMessage = `*مركز صيانة نيوال - فرع البصرة* 🛠️\n\nعزيزي العميل: *${customer.name}*\nيسرنا إبلاغك بأن أجهزتك التالية قد اكتملت صيانتها وهي جاهزة للاستلام:\n\n📦 *تفاصيل الأجهزة:*\n${devicesList}\n\n📍 *مكان الاستلام:* ورشة نيوال - البصرة\n\n⚠️ *تعليمات وشروط الاستلام:*\n1️⃣ يرجى جلب *وصل الصيانة* عند الحضور لاستلام الجهاز.\n2️⃣ لديك *14 يوماً* من تاريخ استلام هذه الرسالة لاستلام المنتجات، وعكس ذلك يسقط حقك في المطالبة بها.\n\n⏰ *أوقات الدوام الرسمية:*\nمن الساعة *8:00 صباحاً* إلى *4:00 مساءً* (يومياً ماعدا يوم الجمعة عطلة رسمية).\n\nشكراً لتعاملكم معنا! ✨`;

            const encodedText = encodeURIComponent(customMessage);
            const waUrl = `https://web.whatsapp.com/send?phone=${customer.phone}&text=${encodedText}`;

            const tr = document.createElement('tr');
            tr.id = `row-${index}`;
            tr.innerHTML = `
                <td>${index}</td>
                <td class="fw-bold">${customer.name}</td>
                <td dir="ltr" class="text-end fw-semibold">+${customer.phone}</td>
                <td><span class="badge bg-secondary">${customer.devices.length}</span></td>
                <td>
                    ${customer.devices.map(d => `<span class="badge badge-devices me-1">${d}</span>`).join(' ')}
                </td>
                <td><span class="badge bg-warning text-dark" id="status-${index}">بانتظار الإرسال</span></td>
                <td>
                    <div class="btn-group">
                        <button class="btn btn-sm btn-outline-secondary" title="معاينة النص" onclick="openPreview('${encodeURIComponent(customMessage)}', '${waUrl}', ${index})">👁️</button>
                        <a href="${waUrl}" target="_blank" onclick="markAsSent(${index})" class="btn btn-sm btn-whatsapp text-nowrap">إرسال 📲</a>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
            index++;
        });

        document.getElementById('resultCard').classList.remove('d-none');
    }

    function openPreview(encodedMsg, waUrl, index) {
        currentModalRowIndex = index;
        document.getElementById('modalMessageContent').innerText = decodeURIComponent(encodedMsg);
        
        const sendBtn = document.getElementById('modalSendBtn');
        sendBtn.href = waUrl;
        sendBtn.onclick = function() {
            markAsSent(currentModalRowIndex);
            bootstrap.Modal.getInstance(document.getElementById('previewModal')).hide();
        };

        new bootstrap.Modal(document.getElementById('previewModal')).show();
    }

    function markAsSent(index) {
        document.getElementById(`row-${index}`).classList.add('sent-row');
        const statusBadge = document.getElementById(`status-${index}`);
        statusBadge.className = 'badge bg-success';
        statusBadge.innerText = 'تم الإرسال';
    }

    function filterTable() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(input) ? '' : 'none';
        });
    }
</script>
</body>
</html>

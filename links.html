<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123d61">
  <meta name="description" content="روابط أدوات ونماذج مركز خدمة NEWAL في البصرة">
  <title>الروابط السريعة | NEWAL</title>
  <style>
    :root { --blue:#14547d;--navy:#10344f;--accent:#1677ae;--ink:#1b3346;--muted:#728397;--line:#dbe6ef;--bg:#f5f8fb; }
    *,*::before,*::after {box-sizing:border-box}
    html {scroll-behavior:smooth}
    body {margin:0;min-height:100vh;background:var(--bg);font:15px/1.65 Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink)}
    .header {background:#fff;border-bottom:1px solid var(--line)}
    .header-inner {max-width:1060px;margin:auto;padding:12px 23px;display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand {display:flex;align-items:center;gap:17px}
    .logo {display:block;width:157px;height:77px;object-fit:contain}
    .brand-label {border-right:1px solid var(--line);padding-right:16px;font-size:13px;font-weight:800;color:#46637a}
    .brand-label small {display:block;color:#899bad;font-size:10px;font-weight:700;letter-spacing:.9px;direction:ltr;text-align:right}
    .header-note {color:#607991;background:#f0f6fa;border:1px solid #e0eaf1;padding:6px 13px;font-size:12px;border-radius:99px}
    main {max-width:1060px;margin:0 auto;padding:32px 23px 45px}
    .intro {background:linear-gradient(115deg,#fff 0%,#fff 60%,#edf6fc 100%);border:1px solid var(--line);border-radius:18px;padding:27px 30px 24px;position:relative;overflow:hidden}
    .intro::before {content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--accent)}
    .eyebrow {margin:0 0 6px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1px}
    h1 {margin:0;color:var(--navy);font-size:clamp(23px,3.1vw,31px);line-height:1.4}
    .subtitle {margin:7px 0 0;color:var(--muted);font-size:13px}
    .topline {display:flex;align-items:center;justify-content:space-between;gap:15px;margin:24px 2px 13px}
    .topline strong {font-size:15px;color:var(--navy)}
    .counter {font-size:12px;color:#71879a}
    .search {width:100%;height:46px;border:1px solid #cfdee9;background:#fff;border-radius:11px;padding:11px 16px;margin-top:18px;outline:none;font:inherit;font-size:13px;color:var(--ink)}
    .search:focus {border-color:#1b7cae;box-shadow:0 0 0 3px #1b7cae22}
    .grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .link-btn {display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;min-height:84px;text-decoration:none;color:inherit;box-shadow:0 2px 10px #16395606;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
    .link-btn:hover {background:#fafdff;border-color:#93c3dd;box-shadow:0 9px 24px #173f6810;transform:translateY(-2px)}
    .link-btn:focus-visible {outline:3px solid #2385c4;outline-offset:3px}
    .link-content {display:flex;align-items:center;gap:12px;min-width:0}
    .document-icon {height:40px;width:40px;flex:none;border-radius:11px;background:#eaf4fb;color:#186c9e;display:grid;place-items:center}
    .document-icon svg {height:20px;width:20px}
    .link-label {font-size:14px;line-height:1.6;font-weight:800;color:var(--navy);overflow-wrap:anywhere}
    .link-file {font:11px/1.6 Consolas,Monaco,monospace;display:block;direction:ltr;text-align:right;color:#899aab;margin-top:2px}
    .arrow {display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:#f0f7fc;color:#1374a8}
    .arrow svg {width:17px;height:17px}
    .empty {display:none;border:1px dashed #cadae7;background:#fff;border-radius:12px;padding:30px;text-align:center;color:#6e8497}
    footer {padding:10px 20px 28px;text-align:center;font-size:11px;color:#92a0ad}
    @media(max-width:700px) {
      .header-inner {padding:9px 15px}.logo {width:121px;height:59px}.brand {gap:9px}.brand-label {padding-right:10px;font-size:11px}.header-note {display:none}
      main {padding:19px 14px 30px}.intro {border-radius:14px;padding:23px 19px 20px}.grid {grid-template-columns:1fr}.link-btn {min-height:75px;padding:13px 14px}
    }
    @media(prefers-reduced-motion:reduce) {*,*::before,*::after {scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>

      { name: "إشعار العملاء بإكمال تصليح الجهاز", url: "wa.html" },
      { name: "إشعار العملاء بأن الأجهزة غير قابلة للإصلاح", url: "wax.html" },
      { name: "فواتير تسليم (توصيل) (تُملأ تلقائياً من ملف إكسل)", url: "xreceipt.html" }
    ];
    // ==================== نهاية قائمة الروابط =========================

    const list = document.getElementById('links');
    const search = document.getElementById('search');
    const counter = document.getElementById('count');
    const empty = document.getElementById('empty');
    const pageIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 9h7M8.5 13h7M8.5 17H13"/></svg>';
    const arrowIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>';
    // لا نسمح بروابط تنفيذية (javascript: ونحوها).
    function safeUrl(url) {
      if(typeof url !== 'string') return null;
      const trimmed = url.trim();
      if (/^[a-zA-Z0-9_-][a-zA-Z0-9_./-]*\.html$/i.test(trimmed) && !trimmed.includes('..')) return trimmed;
      if (/^https:\/\/[^\s]+$/i.test(trimmed)) return trimmed;
      return null;
    }
    function render() {
      const keyword = search.value.trim().toLocaleLowerCase();
      const filtered = PAGES.filter(p => p && typeof p.name === 'string' && safeUrl(p.url) && (`${p.name} ${p.url}`).toLocaleLowerCase().includes(keyword));
      list.replaceChildren();
      counter.textContent = keyword ? `${filtered.length} من ${PAGES.length} روابط` : `${PAGES.length} روابط`;
      empty.style.display = filtered.length ? 'none' : 'block';
      for(const page of filtered) {
        const a = document.createElement('a');
        a.className = 'link-btn';
        a.href = safeUrl(page.url);
        const content = document.createElement('span'); content.className = 'link-content';
        const icon = document.createElement('span'); icon.className = 'document-icon'; icon.innerHTML = pageIcon;
        const labels = document.createElement('span');
        const title = document.createElement('span'); title.className = 'link-label'; title.textContent = page.name;
        const filename = document.createElement('span'); filename.className = 'link-file'; filename.textContent = page.url;
        labels.append(title,filename);content.append(icon,labels);
        const arrow = document.createElement('span'); arrow.className = 'arrow'; arrow.innerHTML = arrowIcon;
        a.append(content,arrow); list.append(a);
      }
    }
    search.addEventListener('input', render);
    render();
  </script>
</body>
</html>
